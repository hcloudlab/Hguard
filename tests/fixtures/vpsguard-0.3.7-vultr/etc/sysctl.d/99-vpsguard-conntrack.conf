# Managed by VPSGuard 0.3.7; optional conntrack timeout profile.
# nf_conntrack is loaded early through /etc/modules-load.d/vpsguard-conntrack.conf so systemd-sysctl can see these keys.
# Netfilter conntrack timeouts; these are not TCP socket TIME_WAIT settings.
net.netfilter.nf_conntrack_tcp_timeout_syn_sent = 30
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 20
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
